<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex-O-Mat</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
:root{
--primary:#6c5ce7;
--accent:#fdcb6e;
--success:#00b894;
--bg:#f4f7f6;
--text:#2d3436;
--danger:#ff7675;
}

body{
font-family:'Segoe UI',sans-serif;
background:var(--bg);
margin:0;
display:flex;
justify-content:center;
padding:20px;
}

.app-container{
background:white;
padding:2rem;
border-radius:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
width:100%;
max-width:420px;
min-height:600px;
display:flex;
flex-direction:column;
}

.header{
text-align:center;
margin-bottom:30px;
cursor:pointer;
user-select:none;
}

.score-board{
background:var(--accent);
padding:8px 20px;
border-radius:20px;
font-weight:bold;
margin-top:10px;
display:inline-block;
}

.quest-item{
border:2px solid #eee;
border-radius:18px;
padding:12px;
margin-bottom:10px;
display:flex;
align-items:center;
gap:10px;
}

.quest-item.done{
background:#e8fcf3;
border-color:var(--success);
}

.quest-content{
flex:1;
display:flex;
justify-content:space-between;
cursor:pointer;
}

.info-btn{
width:36px;
height:36px;
border-radius:50%;
border:none;
background:#fff3bf;
cursor:pointer;
}

.check-circle{
width:26px;
height:26px;
border-radius:50%;
border:2px solid #ccc;
display:flex;
align-items:center;
justify-content:center;
}

.quest-item.done .check-circle{
background:var(--success);
color:white;
border-color:var(--success);
}

/* ADMIN */

#adminPanel{
display:none;
position:fixed;
inset:0;
background:white;
z-index:5000;
overflow:auto;
padding:30px;
}

.admin-card{
background:#f9f9ff;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

.admin-input{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:8px;
}

.admin-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}

.primary{background:var(--primary);color:white;}
.success{background:var(--success);color:white;}
.danger{background:var(--danger);color:white;}

#qr-container{
display:none;
margin-top:20px;
text-align:center;
border:2px dashed var(--success);
padding:15px;
border-radius:20px;
}

</style>
</head>
<body>

<div id="adminPanel">
<h2 style="text-align:center;color:var(--primary)">Flex-O-Mat Back-End ⚙️</h2>

<div id="adminTaskList"></div>

<button class="admin-btn primary" onclick="addTask()">+ Aufgabe</button>
<button class="admin-btn success" onclick="saveConfig()">💾 Speichern & QR</button>
<button class="admin-btn" onclick="closeAdmin()">🏠 App-Modus</button>

<div id="qr-container">
<p><strong>Aktueller Share-Code</strong></p>
<canvas id="qr"></canvas>
</div>
</div>

<div class="app-container">
<div class="header" onclick="handleHeaderClick()">
<h1 style="margin:0;color:var(--primary)">Flex-O-Mat 🎯</h1>
<div class="score-board"><span id="score">0</span> ⭐</div>
</div>

<div id="quest-list"></div>
</div>

<script>
/* ================================
   STABILE SHARE ENGINE v1
================================ */

const STORAGE_KEY="flex_tasks_v6";
const SHARE_VERSION="v1";

let questState=[];
let clickCount=0;

/* ---------- BASE64 URL SAFE ---------- */

function encodeState(obj){
const json=JSON.stringify({v:SHARE_VERSION,data:obj});
const bytes=new TextEncoder().encode(json);
let bin="";
bytes.forEach(b=>bin+=String.fromCharCode(b));
return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

function decodeState(str){
try{
str=str.replace(/-/g,"+").replace(/_/g,"/");
const bin=atob(str);
const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
const json=new TextDecoder().decode(bytes);
const parsed=JSON.parse(json);
if(parsed.v!==SHARE_VERSION) return null;
return parsed.data;
}catch(e){
console.error("Decode Fehler:",e);
return null;
}
}

/* ---------- LOAD ---------- */

function loadInitialState(){
const params=new URLSearchParams(location.search);
const shared=params.get("q");

if(shared){
const decoded=decodeState(shared);
if(decoded){
questState=decoded.map(t=>({...t,completed:false}));
localStorage.setItem(STORAGE_KEY,JSON.stringify(questState));
return;
}
}

const saved=localStorage.getItem(STORAGE_KEY);
questState=saved?JSON.parse(saved):[
{title:"Level 1 starten!",info:"Viel Erfolg!",completed:false}
];
}

/* ---------- SAVE ---------- */

function saveConfig(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(questState));
const link=location.origin+location.pathname+"?q="+encodeState(questState);
generateQR(link);
document.getElementById("qr-container").style.display="block";
}

/* ---------- QR ---------- */

function generateQR(link){
new QRious({
element:document.getElementById("qr"),
value:link,
size:260
});
}

/* ---------- RENDER ---------- */

function render(){
const list=document.getElementById("quest-list");
list.innerHTML="";
let score=0;

questState.forEach((q,i)=>{
if(q.completed) score+=10;

const div=document.createElement("div");
div.className="quest-item"+(q.completed?" done":"");
div.innerHTML=`
<button class="info-btn" onclick="showInfo(${i})">💡</button>
<div class="quest-content" onclick="toggleQuest(${i})">
<span>${q.title}</span>
<div class="check-circle">${q.completed?"✔":""}</div>
</div>
`;
list.appendChild(div);
});

document.getElementById("score").innerText=score;
}

/* ---------- LOGIC ---------- */

function toggleQuest(i){
questState[i].completed=!questState[i].completed;
localStorage.setItem(STORAGE_KEY,JSON.stringify(questState));
render();
}

function showInfo(i){
alert(questState[i].info||"Keine Info");
}

/* ---------- ADMIN ---------- */

function handleHeaderClick(){
clickCount++;
if(clickCount>=5){
document.getElementById("adminPanel").style.display="block";
renderAdmin();
clickCount=0;
}
}

function renderAdmin(){
const list=document.getElementById("adminTaskList");
list.innerHTML="";
questState.forEach((q,i)=>{
const div=document.createElement("div");
div.className="admin-card";
div.innerHTML=`
<input class="admin-input" value="${q.title}" onchange="questState[${i}].title=this.value">
<textarea class="admin-input" onchange="questState[${i}].info=this.value">${q.info}</textarea>
<button class="admin-btn danger" onclick="removeTask(${i})">Löschen</button>
`;
list.appendChild(div);
});
}

function addTask(){
questState.push({title:"Neue Aufgabe",info:"",completed:false});
renderAdmin();
}

function removeTask(i){
questState.splice(i,1);
renderAdmin();
}

function closeAdmin(){
document.getElementById("adminPanel").style.display="none";
render();
}

/* ---------- INIT ---------- */

loadInitialState();
render();

</script>
</body>
</html>
