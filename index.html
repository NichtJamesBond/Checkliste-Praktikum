<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store" />
<title>Flex-O-Mat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
:root {
    --primary: #6c5ce7;
    --accent: #fdcb6e;
    --success: #00b894;
    --bg: #f4f7f6;
    --text: #2d3436;
    --mail-color: #0984e3;
    --danger: #ff7675;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    margin: 0;
    min-height: 100vh;
}

.app-container {
    background: white;
    padding: 2rem;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 400px;
    min-height: 620px;
    display: flex;
    flex-direction: column;
}

.header { text-align: center; margin-bottom: 40px; cursor: pointer; user-select: none; }

.score-board {
    background: var(--accent);
    display: inline-block;
    padding: 10px 25px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 1.2rem;
    color: #000;
    box-shadow: 0 4px 0 #e1b12c;
    margin-top: 20px;
}

.quest-list { list-style: none; padding: 0; flex-grow: 1; }

.quest-item {
    background: white;
    border: 2px solid #f0f0f0;
    margin: 10px 0;
    padding: 12px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.quest-item.done {
    background: #e8fcf3;
    border-color: var(--success);
}

.quest-content {
    flex-grow: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.done .quest-text {
    text-decoration: line-through;
    color: #999;
}

.check-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
}

.done .check-circle {
    background: var(--success);
    border-color: var(--success);
    color: white;
}

.action-btn {
    width: 100%;
    height: 48px;
    border-radius: 14px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: var(--mail-color);
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="app-container">
    <div class="header" onclick="openAdmin()">
        <h1 style="margin:0; color:var(--primary);">Flex-O-Mat 🎯</h1>
        <div class="score-board"><span id="score">0</span> ⭐</div>
    </div>

    <div id="quest-list" class="quest-list"></div>

    <button class="action-btn" onclick="openAdmin()">⚙️ Admin</button>
</div>

<script>

/* =============================
   FLEX-O-MAT STATE & STORAGE
   ============================= */

const SHARE_VERSION = 1;
const STORAGE_KEY = "flex_config_v1";

let questState = [];
let clickCount = 0;

/* =============================
   SHARE ENGINE
   ============================= */

function encodeConfig(obj) {
    const json = JSON.stringify(obj);
    const utf8 = new TextEncoder().encode(json);
    let binary = "";
    utf8.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}

function decodeConfig(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    const binary = atob(str);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
}

function buildConfig() {
    return {
        version: SHARE_VERSION,
        createdAt: Date.now(),
        tasks: questState.map(t => ({
            title: t.title,
            info: t.info
        }))
    };
}

function persistConfig() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(buildConfig()));
}

function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    const configStr = params.get("config");
    if (!configStr) return false;

    try {
        const config = decodeConfig(configStr);
        questState = config.tasks.map(t => ({
            title: t.title,
            info: t.info,
            completed: false
        }));
        persistConfig();
        return true;
    } catch (e) {
        alert("Fehler beim Laden der Konfiguration.");
        return false;
    }
}

function loadFromStorage() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    const config = JSON.parse(saved);
    questState = config.tasks.map(t => ({
        title: t.title,
        info: t.info,
        completed: false
    }));
    return true;
}

function getShareLink() {
    const encoded = encodeConfig(buildConfig());
    return window.location.origin + window.location.pathname + "?config=" + encoded;
}

function generateQR() {
    const qr = new QRious({
        value: getShareLink(),
        size: 300
    });
    const win = window.open("");
    win.document.write("<h3>QR-Code</h3>");
    win.document.body.appendChild(qr.image);
}

/* =============================
   UI LOGIC
   ============================= */

function render() {
    const list = document.getElementById("quest-list");
    list.innerHTML = "";

    let completed = 0;

    questState.forEach((task, i) => {
        if (task.completed) completed++;

        const div = document.createElement("div");
        div.className = "quest-item " + (task.completed ? "done" : "");

        div.innerHTML = `
            <div class="quest-content" onclick="toggleTask(${i})">
                <span class="quest-text">${task.title}</span>
                <div class="check-circle">${task.completed ? "✔" : ""}</div>
            </div>
        `;
        list.appendChild(div);
    });

    document.getElementById("score").innerText = completed * 10;
}

function toggleTask(i) {
    questState[i].completed = !questState[i].completed;
    persistConfig();
    render();
}

/* =============================
   ADMIN PANEL (Prompt-Basiert)
   ============================= */

function openAdmin() {
    const input = prompt("Neue Aufgaben eingeben (durch Komma getrennt):");
    if (!input) return;

    questState = input.split(",").map(t => ({
        title: t.trim(),
        info: "",
        completed: false
    }));

    persistConfig();
    render();

    if (confirm("QR-Code erzeugen?")) {
        generateQR();
    }
}

/* =============================
   INIT
   ============================= */

window.onload = () => {

    const fromURL = loadFromURL();

    if (!fromURL) {
        const fromStorage = loadFromStorage();
        if (!fromStorage) {
            questState = [{
                title: "Level 1 starten!",
                info: "Viel Erfolg!",
                completed: false
            }];
        }
    }

    render();
};

</script>
</body>
</html>
